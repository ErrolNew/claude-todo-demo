<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#1B2133; --muted:#6B7388; --line:#E3E7F0;
  --accent:#3558F0; --accent-soft:#E7ECFF; --danger:#D9435B; --ring-track:#DDE3F3;
  --shadow:0 1px 2px rgba(27,33,51,.04),0 12px 32px -12px rgba(27,33,51,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1320; --surface:#171C2D; --ink:#E9ECF6; --muted:#8F98B2; --line:#262D45;
    --accent:#7C96FF; --accent-soft:#222B52; --danger:#FF7389; --ring-track:#2A3252;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#171C2D; --ink:#E9ECF6; --muted:#8F98B2; --line:#262D45;
  --accent:#7C96FF; --accent-soft:#222B52; --danger:#FF7389; --ring-track:#2A3252;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0}
body{
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  display:flex; justify-content:center; padding:48px 16px 64px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{width:100%; max-width:600px}
header{display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px}
h1{font-size:2.4rem; font-weight:800; letter-spacing:-.03em; line-height:1.1}
.sub{color:var(--muted); font-size:.95rem; margin-top:6px}
.top-right{display:flex; align-items:center; gap:14px}
.ring{position:relative; width:68px; height:68px; flex:none}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:7; stroke-linecap:round}
.ring .track{stroke:var(--ring-track)}
.ring .bar{stroke:var(--accent); stroke-dasharray:176; stroke-dashoffset:176; transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)}
.ring span{position:absolute; inset:0; display:grid; place-items:center; font-weight:700; font-size:.9rem}
.icon-btn{
  width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface);
  color:var(--muted); cursor:pointer; display:grid; place-items:center; transition:color .15s,border-color .15s;
}
.icon-btn:hover{color:var(--ink); border-color:var(--muted)}
.card{background:var(--surface); border-radius:20px; box-shadow:var(--shadow); border:1px solid var(--line)}
form{display:flex; gap:10px; padding:10px; margin-bottom:18px}
form input{
  flex:1; min-width:0; border:0; background:transparent; font:inherit; font-size:1rem;
  color:var(--ink); padding:10px 12px; outline:none;
}
form input::placeholder{color:var(--muted)}
.add{
  border:0; border-radius:12px; background:var(--accent); color:#fff; font:inherit; font-weight:600;
  padding:0 20px; cursor:pointer; transition:transform .1s,filter .15s;
}
:root[data-theme="dark"] .add{color:#0F1320}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .add{color:#0F1320}}
.add:hover{filter:brightness(1.08)} .add:active{transform:scale(.97)}
.toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.filters{display:flex; gap:4px; padding:4px; border-radius:12px; background:var(--surface); border:1px solid var(--line)}
.filters button{
  border:0; background:transparent; font:inherit; font-size:.88rem; font-weight:600; color:var(--muted);
  padding:6px 14px; border-radius:9px; cursor:pointer; transition:background .15s,color .15s;
}
.filters button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent)}
.clear{border:0; background:none; font:inherit; font-size:.88rem; font-weight:600; color:var(--muted); cursor:pointer; padding:6px 4px}
.clear:hover{color:var(--danger)}
ul{list-style:none; padding:0; overflow:hidden}
li{display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid var(--line); transition:background .15s}
li:last-child{border-bottom:0}
li:hover{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
li.enter{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}
.check{
  appearance:none; -webkit-appearance:none; flex:none; width:24px; height:24px; border-radius:8px;
  border:2px solid var(--muted); cursor:pointer; display:grid; place-items:center; transition:all .15s; background:transparent;
}
.check:hover{border-color:var(--accent)}
.check:checked{background:var(--accent); border-color:var(--accent)}
.check:checked::after{content:""; width:6px; height:11px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg) translate(-1px,-1px)}
:root[data-theme="dark"] .check:checked::after{border-color:#0F1320}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .check:checked::after{border-color:#0F1320}}
.text{flex:1; min-width:0; font-size:1rem; word-break:break-word; cursor:text; transition:color .2s}
li.done .text{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--muted)}
.edit{flex:1; min-width:0; font:inherit; font-size:1rem; color:var(--ink); background:var(--bg); border:2px solid var(--accent); border-radius:10px; padding:6px 10px; outline:none}
.del{
  opacity:0; border:0; background:none; color:var(--muted); cursor:pointer; width:32px; height:32px; border-radius:10px;
  display:grid; place-items:center; transition:opacity .15s,color .15s,background .15s;
}
li:hover .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--danger); background:color-mix(in srgb,var(--danger) 12%,transparent)}
@media (hover:none){.del{opacity:1}}
.empty{padding:44px 20px; text-align:center; color:var(--muted)}
.empty strong{display:block; color:var(--ink); font-size:1.05rem; margin-bottom:4px}
footer{margin-top:18px; text-align:center; font-size:.82rem; color:var(--muted)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
@media (max-width:480px){h1{font-size:1.9rem} .add{padding:0 16px}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>Today</h1>
      <p class="sub" id="date"></p>
    </div>
    <div class="top-right">
      <div class="ring" role="img" aria-label="Progress" id="ringWrap">
        <svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="28"/><circle class="bar" id="bar" cx="32" cy="32" r="28"/></svg>
        <span id="pct">0%</span>
      </div>
      <button class="icon-btn" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <form class="card" id="form" autocomplete="off">
    <input id="input" type="text" placeholder="What needs to get done?" aria-label="New task" maxlength="200">
    <button class="add" type="submit">Add task</button>
  </form>

  <div class="toolbar">
    <div class="filters" role="group" aria-label="Filter tasks">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="active" aria-pressed="false">Active</button>
      <button data-f="done" aria-pressed="false">Completed</button>
    </div>
    <button class="clear" id="clear">Clear completed</button>
  </div>

  <div class="card"><ul id="list" aria-live="polite"></ul></div>
  <footer id="count"></footer>
</main>

<script>
(function(){
  const KEY="todo-tasks-v1", THEME="todo-theme";
  const $=s=>document.querySelector(s);
  const list=$("#list"), input=$("#input"), form=$("#form");
  let tasks=[], filter="all", newId=null;

  try{ tasks=JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ tasks=[]; }
  try{ const t=localStorage.getItem(THEME); if(t) document.documentElement.dataset.theme=t; }catch(e){}

  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(tasks)); }catch(e){} };
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  $("#date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});

  function render(){
    const shown=tasks.filter(t=>filter==="all"||(filter==="done"?t.done:!t.done));
    list.innerHTML="";
    if(!shown.length){
      const msgs={
        all:["No tasks yet","Type a task above and press Enter to add it."],
        active:["Nothing left to do","All your tasks are completed."],
        done:["No completed tasks","Check off a task and it will show up here."]
      }[filter];
      list.innerHTML=`<li class="empty" style="display:block"><strong>${msgs[0]}</strong>${msgs[1]}</li>`;
    }
    shown.forEach(t=>{
      const li=document.createElement("li");
      li.dataset.id=t.id;
      if(t.done) li.classList.add("done");
      if(t.id===newId) li.classList.add("enter");
      li.innerHTML=`<input type="checkbox" class="check" aria-label="Mark complete" ${t.done?"checked":""}>
        <span class="text" title="Double-click to edit"></span>
        <button class="del" aria-label="Delete task"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button>`;
      li.querySelector(".text").textContent=t.text;
      list.appendChild(li);
    });
    newId=null;

    const done=tasks.filter(t=>t.done).length, total=tasks.length;
    const pct=total?Math.round(done/total*100):0;
    $("#pct").textContent=pct+"%";
    $("#bar").style.strokeDashoffset=176-(176*pct/100);
    $("#ringWrap").setAttribute("aria-label",`${pct}% complete`);
    const left=total-done;
    $("#count").textContent=total?`${left} ${left===1?"task":"tasks"} left · ${done} completed`:"";
    $("#clear").style.visibility=done?"visible":"hidden";
  }

  form.addEventListener("submit",e=>{
    e.preventDefault();
    const text=input.value.trim();
    if(!text) return;
    const t={id:uid(),text,done:false};
    tasks.unshift(t); newId=t.id;
    input.value=""; save(); render(); input.focus();
  });

  list.addEventListener("click",e=>{
    const li=e.target.closest("li[data-id]"); if(!li) return;
    const t=tasks.find(x=>x.id===li.dataset.id); if(!t) return;
    if(e.target.closest(".del")){ tasks=tasks.filter(x=>x!==t); }
    else if(e.target.classList.contains("check")){ t.done=e.target.checked; }
    else return;
    save(); render();
  });

  list.addEventListener("dblclick",e=>{
    const span=e.target.closest(".text"); if(!span) return;
    const li=span.closest("li"), t=tasks.find(x=>x.id===li.dataset.id);
    const field=document.createElement("input");
    field.className="edit"; field.value=t.text; field.maxLength=200;
    span.replaceWith(field); field.focus(); field.select();
    let finished=false;
    const commit=ok=>{
      if(finished) return; finished=true;
      const v=field.value.trim();
      if(ok&&v) t.text=v;
      save(); render();
    };
    field.addEventListener("keydown",k=>{
      if(k.key==="Enter") commit(true);
      if(k.key==="Escape") commit(false);
    });
    field.addEventListener("blur",()=>commit(true));
  });

  document.querySelectorAll(".filters button").forEach(b=>{
    b.addEventListener("click",()=>{
      filter=b.dataset.f;
      document.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));
      render();
    });
  });

  $("#clear").addEventListener("click",()=>{ tasks=tasks.filter(t=>!t.done); save(); render(); });

  $("#theme").addEventListener("click",()=>{
    const root=document.documentElement;
    const isDark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
    const next=isDark?"light":"dark";
    root.dataset.theme=next;
    try{ localStorage.setItem(THEME,next); }catch(e){}
  });

  render();
})();
</script>
</body>
</html>
